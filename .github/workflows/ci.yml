# CI: build and run the synthetic tests on every push and pull request.
# Least privilege: top-level read-only token; third-party actions pinned to full commit SHAs (version in the comment).
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build AlgorithmSamples.csproj --configfile NuGet.Config
      - name: Test
        run: dotnet run --project AlgorithmSamples.csproj --no-build --no-restore
